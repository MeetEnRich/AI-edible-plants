name: ai_edible_plants
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # AI Integration
  google_generative_ai: ^0.4.6

  # Image & Camera
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  cached_network_image: ^3.4.1

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # State Management
  provider: ^6.1.2

  # UI & Styling
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  smooth_page_indicator: ^2.0.1

  # Network & Sync
  connectivity_plus: ^6.1.4
  firebase_core: ^3.1.1
  cloud_firestore: ^5.0.2
  firebase_auth: ^5.7.0

  # Storage & Utilities
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  http: ^1.6.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
